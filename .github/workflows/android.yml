name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor + plugins
        run: npm install

      - name: Build web bundle
        run: npm run web

      - name: Create Android project
        run: |
          npx cap add android
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          VERSION_CODE=${{ github.run_number }} ./scripts/android-setup.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          sed -i 's/networkTimeout=[0-9]*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && break; echo "retry $i"; sleep 15; done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MAATHU.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MAATHU-apk
          path: MAATHU.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maathu-apk
          name: MAATHU – Android APK (latest build)
          make_latest: true
          files: MAATHU.apk
          body: |
            **MAATHU: Bangara & Gundamma vs the Silence**, latest Android build (`${{ github.sha }}`).

            1. On your Android phone, tap **MAATHU.apk** below to download it.
            2. Open it and allow "Install unknown apps" for your browser when asked.
            3. Allow the microphone when the game asks, so you can say the words out loud.
