name: Build Android APK

on:
  push:
    branches: [main, master, "ccr-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is preset)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install Capacitor
        run: npm install

      - name: Build web bundle
        run: npm run web

      - name: Create Android project
        run: |
          npx cap add android
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          VERSION_CODE=${{ github.run_number }} ./scripts/android-setup.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpellRacers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpellRacers-apk
          path: SpellRacers.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Spell Racers APK (latest build)
          prerelease: true
          make_latest: false
          files: SpellRacers.apk
          body: |
            Latest Android build of Spell Racers from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **SpellRacers.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
