<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#2A1F4E"/>
  <!-- Track line -->
  <rect x="20" y="130" width="152" height="12" rx="6" fill="#4C4560"/>
  <rect x="20" y="130" width="76" height="12" rx="6" fill="#FF7A2F"/>
  <!-- Judy Hopps (rabbit) silhouette -->
  <g transform="translate(52,118)">
    <!-- legs -->
    <rect x="-8" y="-16" width="6" height="16" rx="3" fill="#3A6BE8"/>
    <rect x="2" y="-16" width="6" height="16" rx="3" fill="#3A6BE8"/>
    <!-- body -->
    <ellipse cx="0" cy="-28" rx="14" ry="16" fill="#2E5BD4"/>
    <!-- head -->
    <ellipse cx="0" cy="-46" rx="12" ry="10" fill="#C8CDD6"/>
    <!-- ears -->
    <ellipse cx="-5" cy="-62" rx="4" ry="12" fill="#C8CDD6"/>
    <ellipse cx="5" cy="-62" rx="4" ry="12" fill="#C8CDD6"/>
    <ellipse cx="-5" cy="-62" rx="2" ry="8" fill="#E8A4B8"/>
    <ellipse cx="5" cy="-62" rx="2" ry="8" fill="#E8A4B8"/>
    <!-- eye -->
    <ellipse cx="-2" cy="-46" rx="3" ry="3.5" fill="#fff"/>
    <ellipse cx="-1.5" cy="-46" rx="1.8" ry="2.5" fill="#7B52D6"/>
  </g>
  <!-- Nick Wilde (fox) silhouette -->
  <g transform="translate(130,118)">
    <!-- legs -->
    <rect x="-8" y="-16" width="6" height="16" rx="3" fill="#B8A878"/>
    <rect x="2" y="-16" width="6" height="16" rx="3" fill="#B8A878"/>
    <!-- body -->
    <ellipse cx="0" cy="-28" rx="14" ry="16" fill="#4CAF50"/>
    <!-- head -->
    <ellipse cx="0" cy="-46" rx="12" ry="10" fill="#E07030"/>
    <!-- pointy ears -->
    <polygon points="-7,-55 -12,-68 -2,-58" fill="#E07030"/>
    <polygon points="7,-55 12,-68 2,-58" fill="#E07030"/>
    <polygon points="-7,-58 -10,-67 -4,-60" fill="#C03040"/>
    <polygon points="7,-58 10,-67 4,-60" fill="#C03040"/>
    <!-- muzzle -->
    <ellipse cx="5" cy="-42" rx="6" ry="5" fill="#FFF4E0"/>
    <!-- eye -->
    <ellipse cx="8" cy="-46" rx="3" ry="3.5" fill="#fff"/>
    <ellipse cx="8.5" cy="-46" rx="1.8" ry="2.5" fill="#2E8B2E"/>
    <!-- tail -->
    <ellipse cx="-14" cy="-14" rx="7" ry="12" transform="rotate(20,-14,-14)" fill="#E07030"/>
    <ellipse cx="-14" cy="-5" rx="4" ry="6" transform="rotate(20,-14,-14)" fill="#fff"/>
  </g>
  <!-- Title text -->
  <text x="96" y="175" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#FFC531">SPELL</text>
  <text x="96" y="190" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#FF7A2F">RACERS</text>
</svg>
